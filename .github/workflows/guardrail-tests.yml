name: Recovery guardrail regressions
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  regressions:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: YOUR_GEMINI_API_KEY
      DATABASE_URL: sqlite:///./guardrail-tests.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_guardrail_*.py' -v
